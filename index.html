<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام عبد الرحمن الاحترافي - Free Fire</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #ff6b00;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0d1117;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #e05e00;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0d1117;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .result-value {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 نظام عبد الرحمن الاحترافي 🔥</h1>
    <p class="subtitle">مولد إعدادات الحساسية الذكي لـ Free Fire</p>

    <div class="form-group">
        <label for="deviceType">اختر نوع الجهاز:</label>
        <select id="deviceType" onchange="toggleDpiField()">
            <option value="android">أندرويد (جوال / تابلت)</option>
            <option value="iphone">أيفون (iPhone)</option>
            <option value="ipad">أيباد (iPad)</option>
            <option value="pc">كمبيوتر / محاكي (PC)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="gameMode">اختر نمط اللعب المفضل:</label>
        <select id="gameMode">
            <option value="clash">كلاش سكواد (Clash Squad)</option>
            <option value="ranked">باتل رويال (Ranked)</option>
        </select>
    </div>

    <div class="form-group" id="dpiGroup">
        <label for="dpiInput">قيمة الـ DPI في هاتفك (إن وجد):</label>
        <input type="number" id="dpiInput" placeholder="مثال: 410 أو 580" value="410">
    </div>

    <button onclick="generateSettings()">🎯 توليد إعدادات الحساسية وزر الإطلاق</button>

    <div class="result-box" id="resultBox">
        <h3>✨ الإعدادات المقترحة لجهازك:</h3>
        <div class="result-item"><span>عام:</span> <span class="result-value" id="resGeneral">-</span></div>
        <div class="result-item"><span>نقطة حمراء:</span> <span class="result-value" id="resRedDot">-</span></div>
        <div class="result-item"><span>سكوب 2x:</span> <span class="result-value" id="resScope2">-</span></div>
        <div class="result-item"><span>سكوب 4x:</span> <span class="result-value" id="resScope4">-</span></div>
        <div class="result-item"><span>حجم زر الإطلاق:</span> <span class="result-value" id="resFireButton">-</span></div>
        <div class="result-item" id="resDpiContainer"><span>الـ DPI الموصى به:</span> <span class="result-value" id="resDpi">-</span></div>
    </div>
</div>

<script>
function toggleDpiField() {
    const device = document.getElementById('deviceType').value;
    const dpiGroup = document.getElementById('dpiGroup');
    if (device === 'iphone' || device === 'ipad') {
        dpiGroup.style.display = 'none';
    } else {
        dpiGroup.style.display = 'block';
    }
}

function generateSettings() {
    const device = document.getElementById('deviceType').value;
    const mode = document.getElementById('gameMode').value;
    
    let general, redDot, scope2, scope4, fireButton, dpiText;

    if (device === 'iphone' || device === 'ipad') {
        // حساسية مخصصة للأيفون والأيباد بين 5 و 20 لضمان الثبات وعدم السرعة الزائدة
        general = Math.floor(Math.random() * 11) + 8; // من 8 إلى 18
        redDot = Math.floor(Math.random() * 11) + 10;  // من 10 إلى 20
        scope2 = Math.floor(Math.random() * 10) + 5;   // من 5 إلى 14
        scope4 = Math.floor(Math.random() * 10) + 5;   // من 5 إلى 14
        fireButton = device === 'ipad' ? "38%" : "42%";
        dpiText = "غير مطلوب (نظام iOS)";
    } else if (device === 'pc') {
        general = Math.floor(Math.random() * 15) + 30;
        redDot = Math.floor(Math.random() * 20) + 40;
        scope2 = Math.floor(Math.random() * 20) + 35;
        scope4 = Math.floor(Math.random() * 20) + 30;
        fireButton = "50%";
        dpiText = "DPI الماوس: 800 - 1000";
    } else {
        // أندرويد
        const userDpi = parseInt(document.getElementById('dpiInput').value) || 410;
        general = mode === 'clash' ? 95 : 88;
        redDot = 90;
        scope2 = 85;
        scope4 = 80;
        fireButton = "45%";
        dpiText = userDpi + " (أو رفعه إلى " + (userDpi + 60) + ")";
    }

    document.getElementById('resGeneral').innerText = general;
    document.getElementById('resRedDot').innerText = redDot;
    document.getElementById('resScope2').innerText = scope2;
    document.getElementById('resScope4').innerText = scope4;
    document.getElementById('resFireButton').innerText = fireButton;
    document.getElementById('resDpi').innerText = dpiText;

    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
